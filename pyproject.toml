[tool.ruff]
target-version = "py314"
line-length = 100
include = [
    "main.py",
    "src/**/*.py",
    "src_oop/**/*.py",
    "tests/**/*.py",
]
extend-exclude = [
    "venv",
    ".venv",
    "polygon",
    ".agents",
    ".codex",
    "apps",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.14"
files = ["main.py", "src", "src_oop", "tests"]
exclude = [
    "(^|/)(venv|\\.venv|polygon|apps)(/|$)",
]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not e2e",
]
markers = [
    "e2e: smoke- и end-to-end-проверки, которые запускают приложение как внешний процесс",
]
