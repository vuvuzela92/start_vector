[project]
name = "start-vector"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3,<4",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.2",
    "aiosignal==1.4.0",
    "appnope==0.1.4",
    "asttokens==3.0.0",
    "attrs==25.4.0",
    "azure-ai-inference==1.0.0b9",
    "azure-core==1.37.0",
    "cachetools==6.2.1",
    "certifi==2025.10.5",
    "cffi==2.0.0",
    "charset-normalizer==3.4.3",
    "clickhouse-driver==0.2.9",
    "comm==0.2.3",
    "cryptography==46.0.2",
    "debugpy==1.8.17",
    "decorator==5.2.1",
    "dotenv==0.9.9",
    "et-xmlfile==2.0.0",
    "executing==2.2.1",
    "fastapi>=0.165.0",
    "frozenlist==1.8.0",
    "google-auth==2.41.1",
    "google-auth-oauthlib==1.2.2",
    "gspread==6.2.1",
    "gspread-dataframe==4.0.0",
    "idna==3.11",
    "ipykernel==7.1.0",
    "ipython==9.7.0",
    "ipython-pygments-lexers==1.1.1",
    "isodate==0.7.2",
    "jedi==0.19.2",
    "jupyter-client==8.6.3",
    "jupyter-core==5.9.1",
    "matplotlib-inline==0.2.1",
    "multidict==6.7.0",
    "nest-asyncio==1.6.0",
    "numpy==2.3.4",
    "oauthlib==3.3.1",
    "openai>=2.54.0",
    "openpyxl==3.1.5",
    "packaging==25.0",
    "pandas==2.3.3",
    "parso==0.8.5",
    "pdfminer-six==20250506",
    "pdfplumber==0.11.7",
    "pexpect==4.9.0",
    "pillow==11.3.0",
    "platformdirs==4.5.0",
    "prompt-toolkit==3.0.52",
    "propcache==0.4.1",
    "psutil==7.1.3",
    "psycopg2-binary==2.9.11",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.3",
    "pyasn1==0.6.1",
    "pyasn1-modules==0.4.2",
    "pycparser==2.23",
    "pygments==2.19.2",
    "pymupdf>=2.1",
    "pypdfium2==4.30.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    "pyzmq==27.1.0",
    "requests==2.32.5",
    "requests-oauthlib==2.0.0",
    "rsa==4.9.1",
    "six==1.17.0",
    "sqlalchemy==2.0.44",
    "stack-data==0.6.3",
    "tornado==6.5.2",
    "traitlets==5.14.3",
    "typing-extensions==4.15.0",
    "tzdata==2025.2",
    "tzlocal==5.3.1",
    "urllib3==2.5.0",
    "uvicorn>=0.54.0",
    "wcwidth==0.2.14",
    "yarl==1.22.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
include = [
    "main.py",
    "src/**/*.py",
    "src_oop/**/*.py",
    "tests/**/*.py",
]
extend-exclude = [
    "venv",
    ".venv",
    "polygon",
    ".agents",
    ".codex",
    "apps",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.14"
files = ["main.py", "src", "src_oop", "tests"]
exclude = [
    "(^|/)(venv|\\.venv|polygon|apps)(/|$)",
]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not e2e",
]
markers = [
    "e2e: smoke- и end-to-end-проверки, которые запускают приложение как внешний процесс",
]
